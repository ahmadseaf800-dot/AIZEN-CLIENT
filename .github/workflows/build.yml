name: Build AIZEN Resource Pack

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest
        run: python - <<'PY'
        import json
        from pathlib import Path
        manifest = Path("AIZEN-CLIENT-RP/manifest.json")
        data = json.loads(manifest.read_text(encoding="utf-8"))
        assert data["format_version"] == 2
        assert data["header"]["name"] == "AIZEN CLIENT"
        assert len(data["modules"]) > 0
        print("Manifest JSON is valid.")
        PY

      - name: Create pack icon
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          p = Path("AIZEN-CLIENT-RP/pack_icon.png")
          im = Image.new("RGB", (256, 256), (15, 15, 18))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((12, 12, 244, 244), radius=34, outline=(238, 190, 55), width=8)
          d.text((128, 91), "AIZEN", anchor="mm", fill=(255, 205, 65))
          d.text((128, 145), "CLIENT", anchor="mm", fill=(245, 245, 245))
          d.line((55, 181, 201, 181), fill=(238, 190, 55), width=5)
          im.save(p)
          PY

      - name: Package .mcpack
        run: |
          cd AIZEN-CLIENT-RP
          zip -r ../AIZEN-CLIENT.mcpack .

      - name: Upload downloadable pack
        uses: actions/upload-artifact@v4
        with:
          name: AIZEN-CLIENT-mcpack
          path: AIZEN-CLIENT.mcpack
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AIZEN-CLIENT.mcpack
          generate_release_notes: true
